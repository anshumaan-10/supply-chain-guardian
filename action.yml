name: 'Supply Chain Guardian'
description: 'Enterprise-grade supply chain security scanner. 110+ attack patterns, 17 scanners, runtime monitoring, and binary analysis.'
author: 'Anshumaan Singh (anshumaan-10)'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  mode:
    description: |
      Action execution mode:
        scan           — Full scan (default). Runs all scanners, reports, and optionally starts/stops the runtime monitor within this single step.
        monitor-start  — Only start the runtime monitoring daemon. Use this BEFORE your build/test/deploy steps. The daemon runs in the background watching for threats.
        monitor-stop   — Only stop the runtime monitor and collect findings. Use this AFTER your build steps but before the final scan.
      For split-mode runtime monitoring across multiple pipeline stages, call the action 3 times:
        1. mode: monitor-start  (before your pipeline)
        2. (your build/test/deploy steps)
        3. mode: scan + scan-runtime: true  (collects daemon findings + runs all scanners)
    required: false
    default: 'scan'
  runtime-monitor:
    description: 'Enable continuous runtime monitoring daemon (only used in scan mode). Starts and stops the monitor automatically around the scan.'
    required: false
    default: 'false'
  runtime-monitor-interval:
    description: 'Poll interval in seconds for the runtime monitor daemon (default: 5)'
    required: false
    default: '5'
  scan-mode:
    description: 'Scan mode: quick, standard, deep, paranoid'
    required: false
    default: 'standard'
  fail-on-severity:
    description: 'Minimum severity to fail the pipeline: critical, high, medium, low, info'
    required: false
    default: 'high'
  scan-workflows:
    description: 'Scan GitHub Actions workflow files for compromised actions, pwn requests, cache poisoning, OIDC abuse, artifact integrity, container supply chain, and reusable workflow trust issues'
    required: false
    default: 'true'
  scan-dependencies:
    description: 'Scan package dependencies for known compromised packages and typosquatting'
    required: false
    default: 'true'
  scan-secrets:
    description: 'Scan for secret exposure and credential exfiltration patterns'
    required: false
    default: 'true'
  scan-network:
    description: 'Scan for network exfiltration, reverse shells, DNS tunneling, and C2 patterns'
    required: false
    default: 'true'
  scan-permissions:
    description: 'Audit workflow permissions for least-privilege violations'
    required: false
    default: 'true'
  scan-provenance:
    description: 'Verify dependency provenance and SLSA attestations'
    required: false
    default: 'true'
  scan-runtime:
    description: 'Enable runtime monitoring for credential dumping during workflow execution'
    required: false
    default: 'false'
  custom-rules-path:
    description: 'Path to custom YAML rules file for additional patterns'
    required: false
    default: ''
  exclude-paths:
    description: 'Comma-separated paths to exclude from scanning'
    required: false
    default: ''
  slack-webhook-url:
    description: 'Slack webhook URL for sending alerts'
    required: false
    default: ''
  teams-webhook-url:
    description: 'Microsoft Teams webhook URL for sending alerts'
    required: false
    default: ''
  alert-on-severity:
    description: 'Minimum severity to trigger Slack/Teams alerts: critical, high, medium'
    required: false
    default: 'high'
  sarif-output:
    description: 'Generate SARIF report for GitHub Advanced Security'
    required: false
    default: 'true'
  json-output:
    description: 'Path to write JSON report'
    required: false
    default: 'supply-chain-guardian-report.json'
  table-output:
    description: 'Print detailed table output to workflow logs'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for API access (PR comments, issue creation)'
    required: false
    default: ${{ github.token }}
  block-pr:
    description: 'Block PR merge if critical findings are detected'
    required: false
    default: 'true'
  create-issue:
    description: 'Create a GitHub issue on critical findings'
    required: false
    default: 'true'
  auto-comment-pr:
    description: 'Automatically comment on PRs with scan results'
    required: false
    default: 'true'
  exceptions-config:
    description: |
      Path to a custom SCG exceptions/exemption config file (YAML).
      If not set, the scanner looks for .scg-config.yml in the repo root.
      Use this for org-wide central exception policies.
      Format: YAML with keys: exemptions, egress_allowlist, disabled_scanners, severity_overrides.
    required: false
    default: ''
  scan-binaries:
    description: 'Enable binary analysis scanner to detect suspicious executables in the workspace. Auto-enabled in deep/paranoid modes.'
    required: false
    default: 'false'
  html-output:
    description: 'Generate a self-contained HTML report viewable directly in the browser. Produced alongside JSON/SARIF.'
    required: false
    default: 'false'
  html-output-path:
    description: 'Filename for the HTML report (default: supply-chain-guardian-report.html)'
    required: false
    default: 'supply-chain-guardian-report.html'
  verbose:
    description: 'Enable verbose/debug output'
    required: false
    default: 'false'

outputs:
  scan-status:
    description: 'Overall scan result: PASSED, WARNING, FAILED'
    value: ${{ steps.scan.outputs.scan-status }}
  total-findings:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total-findings }}
  critical-findings:
    description: 'Number of critical findings'
    value: ${{ steps.scan.outputs.critical-findings }}
  high-findings:
    description: 'Number of high severity findings'
    value: ${{ steps.scan.outputs.high-findings }}
  medium-findings:
    description: 'Number of medium severity findings'
    value: ${{ steps.scan.outputs.medium-findings }}
  low-findings:
    description: 'Number of low severity findings'
    value: ${{ steps.scan.outputs.low-findings }}
  report-path:
    description: 'Path to the JSON report file'
    value: ${{ steps.scan.outputs.report-path }}
  sarif-path:
    description: 'Path to the SARIF report file'
    value: ${{ steps.scan.outputs.sarif-path }}
  exempted-findings:
    description: 'Number of findings that were exempted by .scg-config.yml rules'
    value: ${{ steps.scan.outputs.exempted-findings }}

runs:
  using: 'composite'
  steps:
    # ── Setup (always needed) ────────────────────────────────────────────
    - name: Setup Python
      uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
      with:
        python-version: '3.11'

    - name: Install scanner dependencies
      if: inputs.mode == 'scan' || inputs.mode == 'monitor-start'
      shell: bash
      run: |
        pip install -q pyyaml requests tabulate colorama jsonschema semver 2>/dev/null

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # MODE: monitor-start — Start daemon and exit (user's steps run next)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: Start runtime monitor daemon
      if: inputs.mode == 'monitor-start' || (inputs.mode == 'scan' && inputs.runtime-monitor == 'true')
      shell: bash
      env:
        SCG_POLL_INTERVAL: ${{ inputs.runtime-monitor-interval }}
      run: |
        echo "┌──────────────────────────────────────────────┐"
        echo "│  SCG Runtime Monitor — Starting daemon       │"
        echo "│  Interval: ${{ inputs.runtime-monitor-interval }}s                                │"
        echo "└──────────────────────────────────────────────┘"
        python3 ${{ github.action_path }}/src/runtime_monitor.py start ${{ inputs.runtime-monitor-interval }}
        echo ""
        echo "[SCG] ✓ Daemon is now watching for:"
        echo "        · Cryptominers, reverse shells, C2 connections"
        echo "        · /proc/mem access (TeamPCP CVE-2026-33634)"
        echo "        · Persistence mechanisms (sysmon.py, systemd)"
        echo "        · Credential file creation/modification"
        echo "        · Suspicious executables in /tmp"
        echo ""
        echo "[SCG] The monitor will run until 'monitor-stop' or job exit."

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # MODE: monitor-stop — Stop daemon, print findings
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: Stop runtime monitor daemon
      if: inputs.mode == 'monitor-stop' || (inputs.mode == 'scan' && inputs.runtime-monitor == 'true')
      shell: bash
      run: |
        echo "[SCG] Stopping runtime monitor and collecting findings..."
        python3 ${{ github.action_path }}/src/runtime_monitor.py stop || true

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # MODE: scan — Full supply chain scan (default mode)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: Run Supply Chain Guardian
      if: inputs.mode == 'scan'
      id: scan
      shell: bash
      env:
        INPUT_SCAN_MODE: ${{ inputs.scan-mode }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_SCAN_WORKFLOWS: ${{ inputs.scan-workflows }}
        INPUT_SCAN_DEPENDENCIES: ${{ inputs.scan-dependencies }}
        INPUT_SCAN_SECRETS: ${{ inputs.scan-secrets }}
        INPUT_SCAN_NETWORK: ${{ inputs.scan-network }}
        INPUT_SCAN_PERMISSIONS: ${{ inputs.scan-permissions }}
        INPUT_SCAN_PROVENANCE: ${{ inputs.scan-provenance }}
        INPUT_SCAN_RUNTIME: ${{ inputs.scan-runtime }}
        INPUT_CUSTOM_RULES_PATH: ${{ inputs.custom-rules-path }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        INPUT_TEAMS_WEBHOOK_URL: ${{ inputs.teams-webhook-url }}
        INPUT_ALERT_ON_SEVERITY: ${{ inputs.alert-on-severity }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        INPUT_JSON_OUTPUT: ${{ inputs.json-output }}
        INPUT_TABLE_OUTPUT: ${{ inputs.table-output }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_BLOCK_PR: ${{ inputs.block-pr }}
        INPUT_CREATE_ISSUE: ${{ inputs.create-issue }}
        INPUT_AUTO_COMMENT_PR: ${{ inputs.auto-comment-pr }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_EXCEPTIONS_CONFIG: ${{ inputs.exceptions-config }}
        INPUT_SCAN_BINARIES: ${{ inputs.scan-binaries }}
        INPUT_HTML_OUTPUT: ${{ inputs.html-output }}
        INPUT_HTML_OUTPUT_PATH: ${{ inputs.html-output-path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        python3 ${{ github.action_path }}/src/main.py

    - name: Upload SARIF report
      if: inputs.mode == 'scan' && inputs.sarif-output == 'true' && always()
      uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3 # v3
      with:
        sarif_file: supply-chain-guardian.sarif
      continue-on-error: true

    - name: Upload scan report artifact
      if: (inputs.mode == 'scan' || inputs.mode == 'monitor-stop') && always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: supply-chain-guardian-report
        path: |
          supply-chain-guardian-report.json
          supply-chain-guardian-report.html
          supply-chain-guardian.sarif
          /tmp/scg-runtime-monitor/runtime-findings.json
          /tmp/scg-runtime-monitor/monitor.log
        retention-days: 90
      continue-on-error: true
